[project]
name = "midas-worker"
version = "0.1.0"
description = "点金 Midas 后台 Worker (Celery)"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0",
    "redis>=5.2.0",
    "clickhouse-connect>=0.8.0",
    "httpx>=0.28.0",
    "akshare>=1.14.0",
    "yfinance>=0.2.48",
    "ccxt>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
