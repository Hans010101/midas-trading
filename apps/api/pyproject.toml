[project]
name = "midas-api"
version = "0.1.0"
description = "点金 Midas 后端 API 服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "akshare>=1.14.0",
    "yfinance>=0.2.48",
    "ccxt>=4.4.0",
    "clickhouse-connect>=0.8.0",
    "email-validator>=2.2.0",
    "czsc>=0.10.12",
    "litellm>=1.55.0",
    "langgraph>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", ".venv*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "ARG", "PTH", "ERA"]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# alembic 自动生成的 migration 模板含未直接使用的 op/sa 占位导入,允许 F401;
# sa.Column(...) DSL 强制宽行,允许 E501
"alembic/versions/*.py" = ["F401", "E501"]
# 单元测试要测受保护的内部方法(SLF001)+ fixture 仅作 side-effect 注入(PT019)
"tests/**/*.py" = ["SLF001", "PT019"]
# FastAPI 路由用 Query(...)/Path(...) 作参数默认值是官方惯例,B008 不适用
"app/api/**/*.py" = ["B008"]
# email service 内联 HTML 模板有长 style 字符串,E501 不适用
"app/services/email.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# 三方 SDK 都没发 py.typed 标记 / 没 stubs(到 2026-05 为止)
module = [
    "clickhouse_connect.*",
    "akshare.*",
    "yfinance.*",
    "ccxt.*",
    "pandas.*",
    "passlib.*",
    "jose.*",
    "czsc.*",
    "celery.*",
    "litellm.*",
    "langgraph.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# 测试代码不强制 strict 类型(fixtures / factory helpers / asserts 类型噪音多)
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
