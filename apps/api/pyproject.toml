[project]
name = "midas-api"
version = "0.1.0"
description = "点金 Midas 后端 API 服务"
requires-python = ">=3.11"
dependencies = [
    # 上限 <0.137:fastapi 0.137.0(2026-06 发布)改了路由内省暴露(app.routes / route.dependant),
    # 破坏 test_quota / test_admin_user_detail 两个路由内省守护测试(详见 docs/decisions/0043)·
    # 未锁版本时 CI 每次 pip install 拉到 0.137.0 → 全仓 CI 红(旧代码亦然)。锁回已验证全绿的 0.136.x ·
    # 升级 0.137 需先适配这两个测试,另开任务。
    "fastapi>=0.115.0,<0.137",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    # ADR 0032 阶段二:飞书事件 Encrypt Key AES-256-CBC 解密直接 import cryptography ·
    # 虽 python-jose[cryptography] 已传递引入,但代码直接依赖必须显式列(避免隐形 extra 坑)。
    "cryptography>=43.0.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "python-multipart>=0.0.17",
    "akshare>=1.14.0",
    # 港股 board lot:pd.read_excel(engine="openpyxl") 解析 HKEX List of Securities xlsx ·
    # openpyxl 经 akshare/pandas 传递引入,但代码直接依赖必须显式列(避隐形 extra 坑 · 同 cryptography)。
    "openpyxl>=3.1.0",
    "yfinance>=0.2.48",
    "ccxt>=4.4.0",
    "clickhouse-connect>=0.8.0",
    "email-validator>=2.2.0",
    "czsc>=0.10.12",
    "litellm>=1.55.0",
    "langgraph>=0.2.50",
    # KLINE-001:bot「K线」按钮服务端渲染截图(mplfinance 画蜡烛+均线+RSI/MACD → PNG · matplotlib 后端)。
    # matplotlib 原经 akshare 传递引入,但 KLINE-001 直接 import 必须显式列(避隐形 extra 坑 · 同 cryptography/openpyxl)。
    # 生产 slim 镜像中文渲染需 Dockerfile apt 装 fonts-noto-cjk(否则豆腐块 · 已 docker 实测验)。
    "matplotlib>=3.9.0",
    "mplfinance>=0.12.10b0",
    # 市场周报 PDF 附件(P3 第二刀)· 中文用 reportlab 自带 CID 字体 STSong-Light(免 bundle 字体 ·
    # ★无需 Docker apt 装系统字体,区别于 matplotlib 的 fonts-noto-cjk · 纯 Python 零基建改动)。
    "reportlab>=4.2.0",
    # 周报素材 PDF 文本提取(第三刀)· 纯 Python · 零 Docker 改动(md 直读无需库)。
    "pypdf>=5.0.0",
    # 周报素材原始文件存阿里云 OSS(第三刀-B)· ★同步 SDK,调用处用 asyncio.to_thread 包。
    "oss2>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", ".venv*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "ARG", "PTH", "ERA"]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# alembic 自动生成的 migration 模板含未直接使用的 op/sa 占位导入,允许 F401;
# sa.Column(...) DSL 强制宽行,允许 E501
"alembic/versions/*.py" = ["F401", "E501"]
# 单元测试要测受保护的内部方法(SLF001)+ fixture 仅作 side-effect 注入(PT019)
# + 中文注释含括号偶被 ERA001 误判;测试数据内联 dict 偶超长(E501)· 测试里宽免
"tests/**/*.py" = ["SLF001", "PT019", "ERA001", "E501"]
# FastAPI 路由用 Query(...)/Path(...) 作参数默认值是官方惯例,B008 不适用
"app/api/**/*.py" = ["B008"]
# email service 内联 HTML 模板有长 style 字符串,E501 不适用
"app/services/email.py" = ["E501"]
# 告警指标注册表:密集指标定义表(长中文标签)+ fetcher 统一签名(部分参数按协议
# 必留未用)· E501 / ARG001 不适用(0025 G2b)
"app/services/alerts/registry.py" = ["E501", "ARG001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# 三方 SDK 都没发 py.typed 标记 / 没 stubs(到 2026-05 为止)
module = [
    "clickhouse_connect.*",
    "akshare.*",
    "yfinance.*",
    "ccxt.*",
    "pandas.*",
    "passlib.*",
    "jose.*",
    "czsc.*",
    "celery.*",
    "litellm.*",
    "langgraph.*",
    "mplfinance.*",
    "reportlab.*",
    "oss2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# 测试代码不强制 strict 类型(fixtures / factory helpers / asserts 类型噪音多)
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
