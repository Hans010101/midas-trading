<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hero 主视觉:水墨山形 + 朱红 K 线蜡烛涨势 + 帝王金细线脉络
  M1 第三波 任务 E
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="600"
  viewBox="0 0 600 600"
  role="img"
  aria-label="点金 Midas · 水墨山形 + K 线视觉"
>
  <defs>
    <!-- 墨色:从深墨到淡灰 渐变模拟远近山色 -->
    <linearGradient id="mountain-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6B7280" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="mountain-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0.92" />
    </linearGradient>
    <!-- 水墨晕染:turbulence + displacement -->
    <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" />
      <feDisplacementMap in="SourceGraphic" scale="6" />
    </filter>
  </defs>

  <!-- 远山(淡墨)-->
  <g filter="url(#ink-bleed)" opacity="0.85">
    <path
      d="M 0 380
         L 60 320 L 130 360 L 200 280 L 270 340
         L 340 260 L 410 330 L 480 290 L 550 340
         L 600 310 L 600 600 L 0 600 Z"
      fill="url(#mountain-far)"
    />
  </g>

  <!-- 近山(浓墨)-->
  <g filter="url(#ink-bleed)" opacity="0.9">
    <path
      d="M 0 460
         L 80 380 L 160 440 L 240 360 L 320 420
         L 400 340 L 480 410 L 560 370 L 600 400
         L 600 600 L 0 600 Z"
      fill="url(#mountain-near)"
    />
  </g>

  <!-- 帝王金脉络(山纹细线)· 模拟山水画里的勾勒 -->
  <g stroke="#B8860B" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 80 380 Q 140 420 200 400" />
    <path d="M 240 360 Q 320 400 400 340" />
    <path d="M 400 340 Q 460 380 520 400" />
    <path d="M 160 440 Q 220 470 280 460" />
    <path d="M 320 420 Q 380 450 440 430" />
  </g>

  <!-- 朱红 K 线蜡烛(从右下方涨上来 · 5 根)-->
  <g>
    <!-- 蜡烛 1(最低,bear 墨绿模拟刚反转)-->
    <line x1="380" y1="520" x2="380" y2="490" stroke="#0F6E5F" stroke-width="1.5" />
    <rect x="374" y="495" width="12" height="22" fill="#0F6E5F" />
    <line x1="380" y1="525" x2="380" y2="517" stroke="#0F6E5F" stroke-width="1.5" />
    <!-- 蜡烛 2(转涨)-->
    <line x1="420" y1="500" x2="420" y2="465" stroke="#DC143C" stroke-width="1.5" />
    <rect x="414" y="470" width="12" height="28" fill="#DC143C" />
    <line x1="420" y1="500" x2="420" y2="498" stroke="#DC143C" stroke-width="1.5" />
    <!-- 蜡烛 3(继续涨)-->
    <line x1="460" y1="475" x2="460" y2="425" stroke="#DC143C" stroke-width="1.5" />
    <rect x="454" y="430" width="12" height="42" fill="#DC143C" />
    <line x1="460" y1="475" x2="460" y2="472" stroke="#DC143C" stroke-width="1.5" />
    <!-- 蜡烛 4(强势涨)-->
    <line x1="500" y1="440" x2="500" y2="370" stroke="#DC143C" stroke-width="1.5" />
    <rect x="494" y="375" width="12" height="62" fill="#DC143C" />
    <line x1="500" y1="440" x2="500" y2="437" stroke="#DC143C" stroke-width="1.5" />
    <!-- 蜡烛 5(冲到山头)-->
    <line x1="540" y1="380" x2="540" y2="290" stroke="#DC143C" stroke-width="1.5" />
    <rect x="534" y="295" width="12" height="82" fill="#DC143C" />
    <line x1="540" y1="380" x2="540" y2="377" stroke="#DC143C" stroke-width="1.5" />
  </g>

  <!-- 金色趋势线 -->
  <path
    d="M 380 510 L 420 480 L 460 450 L 500 405 L 540 335"
    fill="none"
    stroke="#B8860B"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.7"
  />

  <!-- 一只小印章红点 · 落款感 -->
  <rect
    x="540"
    y="540"
    width="32"
    height="32"
    fill="#C8102E"
    rx="2"
    opacity="0.85"
  />
  <text
    x="556"
    y="563"
    text-anchor="middle"
    font-family="'STKaiti', 'KaiTi', 'Songti SC', serif"
    font-size="24"
    font-weight="900"
    fill="white"
    opacity="0.95"
  >金</text>
</svg>
