name: M2-A 隔离验证(手动触发)

# 手动触发:Actions 页面点 "Run workflow" · 不自动跑(验证是按需的)
# SSH 到服务器 · 在独立目录 /opt/midas-m2-verify 跑隔离验证 ·
# 绝不碰 /opt/midas 生产 · 绝不调 update.sh · 用隔离测试库
on:
  workflow_dispatch:

# 跟生产部署互斥(同一服务器 · 避免 verify 跟 deploy 抢资源)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: M2-A 隔离验证 · feature 分支
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 写入部署 SSH 私钥(复用生产 CI 的 Secret)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: SSH · git worktree 独立目录 + 跑隔离验证脚本
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             # 用 git worktree 从 /opt/midas 拉独立工作目录:
             #   · 共享 /opt/midas/.git(含 remote + credential.helper · 不用额外凭证)
             #   · detached checkout feature 最新 commit · 不碰 /opt/midas 的 main 工作区
             cd /opt/midas
             # 强制 refspec fetch · 确保 origin/feature/m2-crypto-pro 更新到最新
             # (普通 git fetch origin <branch> 偶尔不刷新远端跟踪 ref · 用显式 + refspec 强制)
             git fetch --prune --force origin "+refs/heads/feature/m2-crypto-pro:refs/remotes/origin/feature/m2-crypto-pro"
             TARGET=$(git rev-parse refs/remotes/origin/feature/m2-crypto-pro)
             echo "════ 目标 feature commit: $TARGET ════"
             # 彻底清掉旧 worktree + 目录(避免缓存 / 旧 clone 残留)
             git worktree remove --force /opt/midas-m2-verify 2>/dev/null || true
             rm -rf /opt/midas-m2-verify
             git worktree prune
             # 用解析出的 commit hash 直接 add(不用 symbolic ref · 杜绝歧义)
             git worktree add --force --detach /opt/midas-m2-verify "$TARGET"
             cd /opt/midas-m2-verify
             echo "════ worktree 实际 HEAD: $(git rev-parse HEAD) ════"
             echo "════ worktree 顶部 commit: ════"
             git log --oneline -1
             # 自检:worktree HEAD 必须 == 目标 commit · 否则中止(说明拉取没生效)
             if [ "$(git rev-parse HEAD)" != "$TARGET" ]; then
               echo "❌ worktree HEAD 跟目标 commit 不一致 · 拉取异常 · 中止"; exit 1
             fi
             bash scripts/m2a-verify-ci.sh'

      - name: 清理私钥(无论成败)
        if: always()
        run: rm -f ~/.ssh/deploy_key
