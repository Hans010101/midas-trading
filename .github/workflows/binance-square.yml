name: Binance Square · 独立内容发布

on:
  schedule:
    - cron: '*/20 0-13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midas-trading-binance-square
  cancel-in-progress: false

jobs:
  publish:
    name: 发布合规内容
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BINANCE_SQUARE_API_KEY: ${{ secrets.BINANCE_SQUARE_API_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: 安装配图渲染浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 发布一条合规草稿
        run: node scripts/binance-square-publisher.mjs
