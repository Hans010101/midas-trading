name: Binance Square · 独立内容发布

on:
  schedule:
    - cron: '*/10 0-13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midas-trading-binance-square-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布合规内容 · ${{ matrix.account_key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - account_key: midas_trading
            secret_slot: primary
          - account_key: legacy_midas
            secret_slot: legacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SQUARE_ACCOUNT_KEY: ${{ matrix.account_key }}
      BINANCE_SQUARE_API_KEY: ${{ matrix.secret_slot == 'legacy' && secrets.BINANCE_SQUARE_LEGACY_API_KEY || secrets.BINANCE_SQUARE_API_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: 检查队列并发布一条合规草稿
        run: node scripts/binance-square-publisher.mjs
