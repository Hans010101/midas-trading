name: 前端闸 · lint + type-check + build

# 地基洞延伸:test.yml 补了【后端】CI 闸(pytest+ruff+mypy),但【前端】(apps/web · Next.js 15
#   + TypeScript + pnpm)一直没有任何 PR/push 阶段的 CI 关卡 —— 只靠开发者本地 pnpm build/lint
#   + 部署时 docker 里的 next build。本地漏过的 lint/type 错只能等部署 build 阶段才暴露(晚 + 贵)。
#   本 workflow 补上:起 Node 20 + pnpm 10.32.1(对齐 web Dockerfile),跑 lint + type-check + build,
#   覆盖 apps/web + packages/shared(turbo 从根 fan-out 两个包)。
# ★ 独立于 deploy.yml(完全不碰部署 job)· 只新增 test job · 部署链路零影响。
# ★ 全硬卡(无 continue-on-error)· 跟后端闸一致守新债 · 首跑本地基线 0 lint / 0 type / 0 build。
# 触发:push 到 main / feat/** / fix/**(feature 分支也验)+ PR + 手动。
#   paths:apps/web/** + packages/**(shared 改了也要重验 web)+ 根依赖/构建清单(lock/workspace/
#   turbo/根 package.json · 这些在 root 而非 apps/web 下,改它们会影响前端构建,必须纳入触发)+ 本 workflow。
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/web-test.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/web-test.yml'
  workflow_dispatch:

concurrency:
  group: web-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-test:
    name: lint + type-check + build(Node 20 · pnpm 10.32.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # turbo 首跑非交互 · 关遥测提示噪音(不影响结果)
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # corepack 必须在 setup-node 之前:setup-node 的 cache:pnpm 会调 `pnpm store path`,
      # 那时 pnpm 必须已就位。版本走 root package.json 的 packageManager(pnpm@10.32.1)· 对齐 web Dockerfile。
      - name: 启用 corepack + 激活 pnpm@10.32.1(对齐 root packageManager + web Dockerfile)
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖(frozen-lockfile · 对齐 Dockerfile · 锁定版本防 local↔CI 漂移)
        run: pnpm install --frozen-lockfile

      # ═══ 全硬卡(must pass · 守新债 · 任一红即挡)═══
      # 三步分开跑 = 失败定位更快(秒级 lint 先挂,不用等几分钟 build);且 type-check 单独覆盖
      # packages/shared(next build 只经 transpilePackages 编 web 用到的部分)。
      # if: always() = 即便 lint 先红,type-check / build 仍跑完 → 一次 CI 看全所有 gate 的错,不用逐个改逐个推。
      - name: "★ 硬卡 · pnpm lint(web: next lint · shared: tsc --noEmit)"
        run: pnpm lint

      - name: "★ 硬卡 · pnpm type-check(web + shared: tsc --noEmit)"
        if: always()
        run: pnpm type-check

      - name: "★ 硬卡 · pnpm build(web: next build)"
        if: always()
        run: pnpm build
