name: 测试闸 · pytest + ruff + mypy

# 项目级地基洞:CI 从不跑 pytest(deploy.yml 只 SSH+update.sh+健康检查 · update.sh 0 处 pytest)
#   → 所有历史合并的测试都没在 CI 跑过。本 workflow 补上:起 PG+Redis+ClickHouse,跑全套 + ruff + mypy。
# ★ 独立于 deploy.yml(完全不碰部署 job)· 只新增 test job · 部署链路零影响。
# 触发:push 到 main / feat/** / fix/**(feature 分支也验)+ PR + 手动。
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'apps/api/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'apps/api/**'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff + mypy(PG + Redis + ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: midas
          POSTGRES_PASSWORD: midas_dev
          POSTGRES_DB: midas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midas -d midas_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_USER: midas
          CLICKHOUSE_PASSWORD: midas_dev
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget -nv -O- http://localhost:8123/ping || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15

    env:
      # conftest 硬编码 midas_test · 这里对齐(service 容器已建好该库)
      DATABASE_URL: postgresql+asyncpg://midas:midas_dev@localhost:5432/midas_test
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: midas
      CLICKHOUSE_PASSWORD: midas_dev
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      SECRET_KEY: test-secret-key-do-not-use-in-production

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: 安装依赖(含 dev:pytest/ruff/mypy)
        run: pip install -e ".[dev]"

      - name: ClickHouse 建表(应用 init.sql · 给 ~3 个 CH 测试 · best-effort)
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/docker/clickhouse-init.sql:/init.sql:ro" \
            clickhouse/clickhouse-client:latest \
            --host localhost --user midas --password midas_dev \
            --multiquery --queries-file /init.sql \
            && echo "✅ CH init 完成" || echo "⚠ CH init 部分失败(非 PG 测试·继续)"

      - name: alembic 迁移到 head(midas_test)
        run: alembic upgrade head

      - name: "★ 放行硬条件 · 港股 AI 一键下单 hk 测试(必须绿)"
        run: pytest tests/api/test_ai_order.py -v -k hk

      - name: 全套 pytest(补 CI 从不测的洞 · 历史腐烂如实暴露)
        if: always()
        run: pytest -q

      - name: ruff(自验闸进 CI)
        if: always()
        run: ruff check .

      - name: mypy app/(自验闸进 CI)
        if: always()
        run: mypy app/
