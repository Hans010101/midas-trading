name: 部署到生产(香港 VPS)

# 触发:
#   · push 到 main 分支 → 自动部署
#   · 手动触发(Actions 页面 "Run workflow" 按钮)· 用于回滚 / 重跑
on:
  push:
    branches: [main]
    # 只改 docs / 这个 workflow 自己时不触发(省一次部署)· 按需可删
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    # ADR 0029 DP4:手动触发开关 · 强制完整重建(跳过 update.sh "已是最新" + diff fast-path)
    # 使用场景:① cache 卡脏(buildx 状态损坏)② 依赖未变但要重装(pip 拉新 wheel)
    # ③ 验证 docker image 真实状态(确认 git HEAD ↔ image 不脱钩)
    # push 触发时此 input 为空 · update.sh 默认 FORCE_REBUILD=false 走原快速路径
    inputs:
      force_rebuild:
        description: '强制完整重建(跳过 update.sh 已是最新 + diff 判定 · 重建 api/worker/web)'
        type: boolean
        default: false
        required: false

# 同一时间只允许一个部署在跑 · 后到的排队(部署不能并发,会互相打架)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH 部署 + 健康检查
    runs-on: ubuntu-latest
    timeout-minutes: 30   # update.sh rebuild 最长 ~15min · 留余量

    steps:
      # ────────────────────────────────────────────────
      - name: 写入部署 SSH 私钥(来自 GitHub Secrets)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 私钥从 Secret 注入 · 引号保留换行 · 600 权限
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 把服务器主机公钥加进 known_hosts · 避免首连交互提示
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ────────────────────────────────────────────────
      - name: SSH 到服务器 · 强行同步本地 main = origin/main + update.sh
        run: |
          set -e
          # FORCE_REBUILD 透传:push 事件 inputs.force_rebuild 为空字符串 →
          # update.sh 的 ${FORCE_REBUILD:-false} 默认为 false · 不影响自动部署
          #
          # ── ADR 0029 hotfix-2 · git reset --hard origin/main(替代 checkout -f main) ──
          # 让 update.sh 自身改动立即生效(disk 同步)· 实战故障实证 N1/N2 部署链
          #
          # ── ADR 0031 · fast-path 误判修复(DP1 · 方向 B) ──
          # 副作用:reset 后 server local main 已 = origin/main · update.sh 1/7 看 HEAD 没动
          #         → 误判 "无需重建" → fast-path → 普通 push 不真重建(被迫 push 两次)
          # 修法:在 reset 【之前】算 OLD_HEAD,reset 【之后】算 NEW_HEAD,一起 export 给
          #       update.sh · 这样 update.sh 1/7 拿到的是 reset 前的真实 server HEAD
          # 引号:外层 "..." 让 GH Actions 展开 secrets / inputs · 内层 \$(...) 转义避免
          #       GH runner 本地展开,$ 要由远端 bash 解释(SSH 到远端后才执行)
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/midas && OLD_HEAD=\$(git rev-parse HEAD) && git fetch origin main && git checkout main && git reset --hard origin/main && NEW_HEAD=\$(git rev-parse HEAD) && OLD_HEAD=\$OLD_HEAD NEW_HEAD=\$NEW_HEAD FORCE_REBUILD='${{ inputs.force_rebuild }}' bash update.sh"

      # ────────────────────────────────────────────────
      # update.sh 内部已做容器健康检查 · 这里再从 GitHub runner(外网)
      # 打一次公网 HTTPS 端点 · 验证 DNS + Caddy + api 整条链路对外可用
      - name: 外部健康检查 · 公网 HTTPS 端点
        run: |
          echo "等 5s 让服务稳定..."
          sleep 5
          echo "── api.midastrade.asia/health ──"
          curl -fsS --max-time 20 https://api.midastrade.asia/health
          echo ""
          echo "── midastrade.asia 首页 ──"
          curl -fsS -o /dev/null -w "web HTTP %{http_code} · %{time_total}s\n" --max-time 20 https://midastrade.asia/

      # ────────────────────────────────────────────────
      - name: 清理私钥(无论成败都跑)
        if: always()
        run: rm -f ~/.ssh/deploy_key
