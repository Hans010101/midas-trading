name: 部署到生产(香港 VPS)

# ── ★部署基建根治(build 挪出 7G VPS)· 新链 ─────────────────────────────────────
# 旧链:单 job·SSH 到 VPS 上 docker compose build 三镜像(同机重型 build 无内存余量 →
#   i18n 批0 连翻三次:内存竞争 / redirect loop / 整机卡死到 SSH 不可达)。
# 新链:① build-push job(Actions runner 内存充足·矩阵并行 build 三镜像 → 推阿里云 ACR)
#       ② deploy job(needs build-push·SSH VPS 只 docker compose pull + recreate·零构建负载)。
#   ★build 失败 = Actions 红 = deploy job 根本不跑 = 生产纹丝不动(#91「build 失败宕机」物理消失)。
#   ★DEPLOY_MODE=build 兜底保留在 update.sh(三层回滚兜底之一)· 可 workflow_dispatch 选 build。

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制完整重建(跳 update.sh 已是最新 + diff·重建 api/worker/web)'
        type: boolean
        default: false
        required: false
      deploy_mode:
        description: 'VPS 部署模式:pull(默认·拉 ACR 镜像)/ build(兜底·VPS 本地 build)'
        type: choice
        options: [pull, build]
        default: pull
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # job 1 · build+push 三镜像到 ACR(在 Actions runner·内存充足·build 物理离开 VPS)
  # ══════════════════════════════════════════════════════════════════════════
  build-push:
    name: build+push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # 一个镜像失败不掐断其它两个(便于一次看全)
      matrix:
        include:
          - { service: api, context: ./apps/api, file: ./apps/api/Dockerfile }
          - { service: worker, context: ., file: ./apps/worker/Dockerfile }
          - { service: web, context: ., file: ./apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 ACR（公网 registry）
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: build + push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # ★仅 web 需要 NEXT_PUBLIC_API_URL(build-time inline·ADR0016)· api/worker 传空
          build-args: ${{ matrix.service == 'web' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL) || '' }}
          push: true
          # ★tag=github.sha(全 40 位·与 VPS update.sh 的 NEW_HEAD 同 sha·pull 对得上)+ latest
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/midas-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/midas-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # ★web bundle 断言:必须含生产 API URL(NEXT_PUBLIC_API_URL 被 inline)· 防整站白屏(ADR0016)。
      #   只正向查 api.midastrade.asia(只可能来自注入·可靠)· 不查 localhost 残留(?? 兜底字面量假阳性)。
      - name: 验 web bundle 的 NEXT_PUBLIC_API_URL（防 localhost 白屏）
        if: matrix.service == 'web'
        run: |
          set -e
          IMG="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/midas-web:${{ github.sha }}"
          docker pull "$IMG"
          if docker run --rm "$IMG" sh -c 'grep -rlF "api.midastrade.asia" .next 2>/dev/null | head -1' | grep -q .; then
            echo "✅ web bundle 含生产 API URL(api.midastrade.asia)· build-arg 注入正确"
          else
            echo "❌ web bundle 未含生产 API URL → build-arg 没注入(整站会白屏)"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # job 2 · SSH VPS · pull 已 build 好的镜像 + recreate(VPS 零构建负载)
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: SSH 部署（pull 模式）+ 健康检查
    needs: build-push # ★三镜像 build+push 全成功才部署;任一失败 → 此 job 不跑 → 生产不动
    runs-on: ubuntu-latest
    timeout-minutes: 20 # pull + recreate + alembic + 健康检查(无 build)· 远短于旧链的顺序 build

    steps:
      - name: 写入部署 SSH 私钥(来自 GitHub Secrets)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: SSH 到服务器 · 强行同步 main + update.sh（DEPLOY_MODE=pull）
        run: |
          set -e
          # ★DEPLOY_MODE=pull(默认)· update.sh 走 pull 分支:docker compose pull 精确 sha tag →
          #   recreate · VPS 零构建负载。workflow_dispatch 可选 deploy_mode=build 走兜底本地 build。
          # ★git reset 对齐【触发本次 run 的 commit sha】(github.sha)· 而非盲取 origin/main ——
          #   根治双合并/交叉部署 race:每个 run 部署自己 build-push 出的那个 sha 镜像。
          #   盲取 origin/main 时,若本 run 运行中又有新合并进 main,reset 会跳到新 sha,
          #   再 pull 未 build 的新 sha 镜像 → not found → 回滚(2026-07-06 #166+#165 双合并事故根治)。
          #   ${{ github.sha }} = build-push job 打 tag 的同一 sha → pull 必命中本 run 建的镜像。
          #   NEW_HEAD 由 reset 后 HEAD 派生(= github.sha)· update.sh 吃传入 NEW_HEAD 作 MIDAS_IMAGE_TAG。
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/midas && OLD_HEAD=\$(git rev-parse HEAD) && git fetch origin main && git checkout main && git reset --hard ${{ github.sha }} && NEW_HEAD=\$(git rev-parse HEAD) && OLD_HEAD=\$OLD_HEAD NEW_HEAD=\$NEW_HEAD DEPLOY_MODE='${{ inputs.deploy_mode || 'pull' }}' FORCE_REBUILD='${{ inputs.force_rebuild }}' bash update.sh"

      # ★外部健康检查:严格 200 + redirect-loop 探测(2026-07-03 i18n 批0 redirect loop 教训)。
      #   旧 `curl -fsS /` 的 -f 只 4xx/5xx 失败、放过 3xx → localeDetection 让 /→307→/ 死循环时
      #   仍报 web HTTP 307 success 漏掉中文站崩(假绿)。现:① 关键页必须 200 ② -L 探 redirect loop。
      - name: 外部健康检查 · 公网 HTTPS 端点（严格 200 + loop 探测）
        run: |
          echo "等 5s 让服务稳定..."
          sleep 5
          # ★重试容差(2026-07-06 #166 假负事故):recreate 后公网端点可能瞬时未就绪,
          #   给 3×5s retry —— 瞬时未就绪重试即恢复;真故障(retry 耗尽仍失败)才判死(不放过真崩)。
          retry_curl() {  # $1=url $2=label · api/health 类(严格成功·-fsS)· 3×5s
            local i
            for i in 1 2 3; do
              if curl -fsS --max-time 20 "$1" >/dev/null 2>&1; then
                echo "  ✓ $2: 就绪(第 $i 次)"; return 0
              fi
              echo "  $2: 第 $i/3 次未就绪 · 5s 后重试"; [ "$i" -lt 3 ] && sleep 5
            done
            echo "  ❌ $2 3 次仍失败 · 部署判失败"; return 1
          }
          check_200() {  # $1=url $2=label · 关键页严格 200 · 3×5s
            local code i
            for i in 1 2 3; do
              # ★|| true 不可省:GHA 默认 bash -eo pipefail 下,裸 code=$(curl) 若 curl 连接级
              #   失败(conn-refused exit7 / timeout exit28 = 瞬时未就绪的一种)→ 命令替换非零 →
              #   set -e 当场退出、retry 一次都不跑(实测复刻 exit=7·循环零打印)。|| true 让替换
              #   永不失败→set -e 不触发→retry 正常;curl 失败时 %{http_code} 已输出 000·仍走重试。
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$1" || true)
              if [ "$code" = "200" ]; then echo "  ✓ $2: HTTP 200(第 $i 次)"; return 0; fi
              echo "  $2: HTTP ${code}(第 $i/3 次非 200 · 5s 后重试)"; [ "$i" -lt 3 ] && sleep 5
            done
            echo "  ❌ $2 3 次仍非 200(疑 redirect loop / 崩 / 未就绪)· 部署判失败"; return 1
          }
          echo "── api.midastrade.asia/health(3×5s retry)──"
          retry_curl "https://api.midastrade.asia/health" "api/health"
          echo "── 中文关键页严格 200(3×5s retry)──"
          # ★多市场逐页覆盖(CLAUDE.md 红线:同功能不同市场=不同前端组件·只验一个面≠全覆盖):
          #   crypto-market / hk-market 是与 MarketHomePage 无关的独立组件(us 复用 cn 故 cn 代验),
          #   补进探针清单防「单个市场页构建崩、其它页正常」被判绿(/crypto-preview CryptoAiCard 教训同型)。
          check_200 "https://midastrade.asia/" "中文首页 /"
          check_200 "https://midastrade.asia/cn-market" "/cn-market"
          check_200 "https://midastrade.asia/crypto-market" "/crypto-market"
          check_200 "https://midastrade.asia/hk-market" "/hk-market"
          check_200 "https://midastrade.asia/workbench" "/workbench"
          # ★redirect-loop 现由上面 check_200 "/"(严格 200·不跟 -L)兜死:真有 /→307→/ 死循环时
          #   首跳返 3xx ≠ 200 → check_200 直接判失败。故这条 -L 探测退化为纯诊断(打印跳数/耗时),
          #   末尾 `|| true` 让它【不再是零容忍的裸命令】—— 否则 recreate 后一次瞬时 conn-refused/timeout
          #   就把整步 set -e 击穿判死(与 check_200 无 || true 同类假负;那条已修,这条一并根治)。
          echo "── redirect-loop 诊断(判定已由 check_200 \"/\" 严格 200 承担·这里仅打印)──"
          curl -fsS -L --max-redirs 3 -o /dev/null -w "  / 跟随最终 HTTP %{http_code} · 跳 %{num_redirects} · %{time_total}s\n" --max-time 20 https://midastrade.asia/ || true

      - name: 清理私钥(无论成败都跑)
        if: always()
        run: rm -f ~/.ssh/deploy_key
