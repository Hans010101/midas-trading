# 点金 Midas 生产环境 overlay · 阿里云香港 4 vCPU / 8GB RAM
# 跟 docker-compose.yaml 合用:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
#
# 跟 dev 的区别:
#   - 不暴露 postgres / clickhouse / redis 到主机(只走 docker 内部 DNS)
#   - api 只对 127.0.0.1:8000 暴露(配合 Caddy 反代)
#   - 各服务 memory 限制 · 全栈控制在 ~5.5GB 内 · 留 2.5GB 给系统 + 突发
#   - ClickHouse 调优:max_memory_usage / mark_cache_size 全面降级
#   - 关闭 debug 日志 · json-file driver rotate

name: midas

services:
  postgres:
    ports: !reset []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 768M
    command:
      # 4 核 8G 单 VPS · postgres 中等负载调优
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=80

  clickhouse:
    ports: !reset []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
    # ClickHouse 默认假设独占机器 · 单 VPS 共享必须显式降级避免 OOM
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DATABASE:-default}"
      # max_server_memory_usage:用户查询 + 后台合并总上限 1.5GB
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE: "1610612736"
      # 单查询上限 1GB
      CLICKHOUSE_MAX_MEMORY_USAGE: "1073741824"
      # 标记缓存 128MB(默认 5GB)
      CLICKHOUSE_MARK_CACHE_SIZE: "134217728"
      # 未压缩缓存 64MB(默认 8GB)
      CLICKHOUSE_UNCOMPRESSED_CACHE_SIZE: "67108864"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    ports: !reset []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
    command: >
      redis-server
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --save 60 100
      --appendonly no

  api:
    # 只对 localhost(Caddy 反代) · 不直接面向公网
    ports:
      - "127.0.0.1:8000:8000"
    restart: always
    environment:
      DEBUG: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    restart: always
    environment:
      DEBUG: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    # Vercel 模式下不启动这个 service ·
    # 自托管全栈模式才用:`docker compose --profile self-hosted up`
    profiles:
      - self-hosted
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 768M
