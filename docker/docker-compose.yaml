name: midas

# 点金 Midas M0 本地编排
# 启动:cd docker && docker compose up -d
# 验证:curl http://localhost:8000/health → {"status":"ok",...}

services:
  postgres:
    image: postgres:16-alpine
    container_name: midas-postgres
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-midas}
      POSTGRES_USER: ${POSTGRES_USER:-midas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midas_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - midas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midas} -d ${POSTGRES_DB:-midas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: midas-clickhouse
    restart: unless-stopped
    # ClickHouse 25.x 起 default 用户被自动随机密码;显式建一个 midas 业务用户绕过
    # 详见 docs/decisions/0002 第 1 条
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-midas}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-midas_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - midas-net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-nv", "-O-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: midas-redis
    restart: unless-stopped
    # 宿主机映射 6380(本机存在另一个项目的 redis 占用 6379);
    # docker 内部 DNS 依旧用 redis:6379
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - midas-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: midas-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      # 容器内部域名覆盖(以下值都不带 ${VAR} 插值 · 避免 Compose 找不到 .env 时回退到默认值)
      # DATABASE_URL 不在这里设 · 由 env_file ../.env 提供(包含真实 POSTGRES_PASSWORD)·
      # 历史踩坑:0014 ADR 2026-05-21 · YAML interpolation ${POSTGRES_PASSWORD:-midas_dev}
      # 在 compose 找不到 .env 时回退到 midas_dev · 覆盖了 env_file 的正确值
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - midas-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build:
      # context 是仓库根:worker 容器要同时拥有 apps/api(app.* 模块)和 apps/worker
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: midas-worker
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      # DATABASE_URL 见 api · 由 env_file 提供 · 不在 YAML 里拼装(0014 ADR)
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - midas-net
    volumes:
      # 共享回测 artifacts 卷:vibe-worker 写 / 主 worker 读 + 落库后清(P1-4b 方案戊)
      - backtest_runs:/work/runs

  # ── P1-4b 方案戊:vibe 专用 Celery worker(消费 backtest 队列)──────────────────
  # 主 worker enqueue 到 backtest 队列 → 本服务跑 run_backtest_job 逻辑 → 写 artifacts 共享卷
  # → 结果经 Celery 回主 worker 落库。★ 不挂 docker.sock · 不装 app./不拿 DB 凭证(只算不落库)。
  vibe-worker:
    image: midas-vibe:0.1.9            # ★ 独立镜像(非 compose build)· update.sh 单独 docker build
    container_name: midas-vibe-worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - vibe_celery_app
      - worker
      - -Q
      - backtest                       # ★ 只消费 backtest 队列(主 worker 永不加 -Q backtest)
      - --concurrency=1                # 内存现实:一次一个回测
      - -n
      - vibe@%h
      - --loglevel=info
    # ★ 补强1:不用 env_file ../.env(常驻服务最小权限,不塞 DB/SECRET 全量)·
    #   只显式给 CH 连接 + Redis broker;密码从 compose 环境(.env)引,不硬编码、不进镜像。
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - midas-net
    volumes:
      # ★ 相对路径以 compose 所在 docker/ 为基:../ = 仓库根
      - backtest_runs:/work/runs                                                         # 写 artifacts
      - ../apps/api/app/services/backtest/midas_ch_loader.py:/work/midas_ch_loader.py:ro  # loader 单一来源挂载
      - ../deploy/vibe/run_backtest_job.py:/work/run_backtest_job.py:ro
      - ../deploy/vibe/vibe_celery_app.py:/work/vibe_celery_app.py:ro
    # 镜像已 USER vibe(非 root)· 不映射端口(不经 Caddy / 不面向公网)

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* 是 build-time inline · 必须通过 build args 传给 Dockerfile ARG
      # 否则 Next build 看到的是 fallback(localhost:8000)· 0016 ADR
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: midas-web
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      # runtime env(给 server-side Next.js 用 · 不影响已 inline 到 bundle 的 NEXT_PUBLIC_*)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # NextAuth v5 在容器内 server-side 调后端走 docker 内部 DNS
      API_INTERNAL_URL: http://api:8000
      # NextAuth v5 显式锁定 base URL · 不靠 Host 头反推(避免 redirect_uri_mismatch)
      AUTH_URL: ${PUBLIC_WEB_URL:-https://midastrade.asia}
      # NextAuth v5 用 AUTH_SECRET(原 NEXTAUTH_SECRET 是 v4)· 跟后端 JWT 共用
      AUTH_SECRET: ${SECRET_KEY:-fallback-dev-only}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - midas-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  midas-net:
    name: midas-net
    driver: bridge

volumes:
  postgres_data:
    name: midas-postgres-data
  clickhouse_data:
    name: midas-clickhouse-data
  redis_data:
    name: midas-redis-data
  backtest_runs:
    name: midas-backtest-runs
