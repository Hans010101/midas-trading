name: midas

# 点金 Midas M0 本地编排
# 启动:cd docker && docker compose up -d
# 验证:curl http://localhost:8000/health → {"status":"ok",...}

services:
  postgres:
    image: postgres:16-alpine
    container_name: midas-postgres
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-midas}
      POSTGRES_USER: ${POSTGRES_USER:-midas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midas_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - midas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midas} -d ${POSTGRES_DB:-midas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: midas-clickhouse
    restart: unless-stopped
    # ClickHouse 25.x 起 default 用户被自动随机密码;显式建一个 midas 业务用户绕过
    # 详见 docs/decisions/0002 第 1 条
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-midas}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-midas_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - midas-net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-nv", "-O-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: midas-redis
    restart: unless-stopped
    # 宿主机映射 6380(本机存在另一个项目的 redis 占用 6379);
    # docker 内部 DNS 依旧用 redis:6379
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - midas-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    # ★部署基建根治(build 挪出 VPS):image+build 并存 —— compose build 走 build 段(dev/兜底
    #   本地构建并打上此名)· compose pull 走 image 从仓库拉(prod)· 命令决定行为·dev 零破坏。
    #   ★默认(两变量都不设)= `midas-api`,精确等于 compose 派生的现有本地镜像名(project=midas)·
    #   保证加了 image: 后 compose up 不会因"镜像名变了/不存在"而误触发 build(dev + 现网 build 模式零破坏)。
    #   prod pull 模式由 update.sh/.env 设 MIDAS_REGISTRY(VPC 地址)+ MIDAS_IMAGE_TAG(git sha)→ 拉 ACR。
    image: ${MIDAS_REGISTRY:+${MIDAS_REGISTRY}/}midas-api${MIDAS_IMAGE_TAG:+:${MIDAS_IMAGE_TAG}}
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: midas-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      # 容器内部域名覆盖(以下值都不带 ${VAR} 插值 · 避免 Compose 找不到 .env 时回退到默认值)
      # DATABASE_URL 不在这里设 · 由 env_file ../.env 提供(包含真实 POSTGRES_PASSWORD)·
      # 历史踩坑:0014 ADR 2026-05-21 · YAML interpolation ${POSTGRES_PASSWORD:-midas_dev}
      # 在 compose 找不到 .env 时回退到 midas_dev · 覆盖了 env_file 的正确值
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - midas-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      # ★ X 营销每日推文截图共享卷(x-shooter 写 / api 读出图 FileResponse · 阶段4a PR-4)
      - x_shots:/shots

  worker:
    # ★部署基建根治:image+build 并存(见 api 注释)· 默认=派生名 midas-worker(现有·不误 build)· prod pull。
    image: ${MIDAS_REGISTRY:+${MIDAS_REGISTRY}/}midas-worker${MIDAS_IMAGE_TAG:+:${MIDAS_IMAGE_TAG}}
    build:
      # context 是仓库根:worker 容器要同时拥有 apps/api(app.* 模块)和 apps/worker
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: midas-worker
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      # DATABASE_URL 见 api · 由 env_file 提供 · 不在 YAML 里拼装(0014 ADR)
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - midas-net
    volumes:
      # 共享回测 artifacts 卷:vibe-worker 写 / 主 worker 读 + 落库后清(P1-4b 方案戊)
      - backtest_runs:/work/runs
      # ★ X 营销截图共享卷:x-shooter 写 / 主 worker 24h 清理 unlink(阶段4a PR-4)
      - x_shots:/shots

  # ── P1-4b 方案戊:vibe 专用 Celery worker(消费 backtest 队列)──────────────────
  # 主 worker enqueue 到 backtest 队列 → 本服务跑 run_backtest_job 逻辑 → 写 artifacts 共享卷
  # → 结果经 Celery 回主 worker 落库。★ 不挂 docker.sock · 不装 app./不拿 DB 凭证(只算不落库)。
  vibe-worker:
    image: midas-vibe:0.1.9            # ★ 独立镜像(非 compose build)· update.sh 单独 docker build
    container_name: midas-vibe-worker
    restart: unless-stopped
    # ── M1b 卷权限持久化(取代 M1a 手动 chown)─────────────────────────────────────
    # 容器以 root 起 → chown 共享卷 /work/runs 给 vibe(uid 10001)→ celery 原生 --uid/--gid
    # 在初始化后把 worker 进程降到 10001(★ 主进程非 root · 红线不破)。
    # ★ 每次容器启动都 re-apply chown → 删卷重建 / 换机后 vibe-worker 仍能写 /work/runs(M1b 核心,
    #   区别于 M1a 一次性手动 chown)。不挂 docker.sock、不改镜像、无 gosu(用 celery 自带降权)·
    #   短暂 root 仅做 chown + celery 特权初始化,随即降权。
    user: "0:0"
    command:
      - sh
      - -c
      - |
        chown -R 10001:10001 /work/runs 2>/dev/null || true
        exec celery -A vibe_celery_app worker -Q backtest --concurrency=1 -n vibe@%h --loglevel=info --uid=10001 --gid=10001
    # ★ S1a 修(R1b update.sh:292 compose up 失败修复 · Hans 拍板):
    #   原 P1-4b-1 用 ${CLICKHOUSE_PASSWORD} 插值取凭证 → compose 插值找 .env 是在
    #   project-directory(= 第一个 -f 文件目录 = docker/)找,docker/ 下无 .env →
    #   CLICKHOUSE_USER/PASSWORD 取空 → vibe-worker recreate 失败 → 292 行炸 → 自动回滚。
    #   改为 env_file: ../.env(与 api/worker/web 逐字一致):路径相对 compose 文件位置(docker/)
    #   解析到仓库根 /opt/midas/.env,与运行 CWD 无关,稳定不踩插值坑。
    #   ⚠ 取舍:env_file 全量注入 .env(牺牲原"最小权限"设计,vibe 容器拿到全量 env)。Hans 拍板
    #   S1a:换稳定 + 与现有一致。vibe 在内网 / 不暴露端口 / 镜像不含 DB 驱动(连不了 PG),全量
    #   .env 风险有限;env 最小化(走 --env-file 显式路径)作为后续优化项。
    env_file:
      - path: ../.env
        required: true
    environment:
      # 容器内固定的非密配置(域名/端口/broker · 覆盖 env_file 里可能的 localhost 值)· 不走插值。
      # 凭证(CLICKHOUSE_USER/PASSWORD/DATABASE)由上面 env_file ../.env 提供。
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - midas-net
    volumes:
      # ★ 相对路径以 compose 所在 docker/ 为基:../ = 仓库根
      - backtest_runs:/work/runs                                                         # 写 artifacts
      - ../apps/api/app/services/backtest/midas_ch_loader.py:/work/midas_ch_loader.py:ro  # loader 单一来源挂载
      - ../deploy/vibe/run_backtest_job.py:/work/run_backtest_job.py:ro
      - ../deploy/vibe/vibe_celery_app.py:/work/vibe_celery_app.py:ro
    # 镜像已 USER vibe(非 root)· 不映射端口(不经 Caddy / 不面向公网)

  web:
    # ★部署基建根治:image+build 并存(见 api 注释)· dev 零破坏 · prod pull。
    #   ★web 镜像的 NEXT_PUBLIC_API_URL 是 build-time inline·prod 镜像已由 CI(build-push.yml)
    #   用生产值 build 好推 ACR;VPS pull 时不再本地 build,故 build.args 只影响 dev 本地 build。
    #   ★默认=派生名 midas-web(现有·不误 build)。
    image: ${MIDAS_REGISTRY:+${MIDAS_REGISTRY}/}midas-web${MIDAS_IMAGE_TAG:+:${MIDAS_IMAGE_TAG}}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* 是 build-time inline · 必须通过 build args 传给 Dockerfile ARG
      # 否则 Next build 看到的是 fallback(localhost:8000)· 0016 ADR
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: midas-web
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: true
    environment:
      # runtime env(给 server-side Next.js 用 · 不影响已 inline 到 bundle 的 NEXT_PUBLIC_*)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # NextAuth v5 在容器内 server-side 调后端走 docker 内部 DNS
      API_INTERNAL_URL: http://api:8000
      # NextAuth v5 显式锁定 base URL · 不靠 Host 头反推(避免 redirect_uri_mismatch)
      AUTH_URL: ${PUBLIC_WEB_URL:-https://midastrade.asia}
      # NextAuth v5 用 AUTH_SECRET(原 NEXTAUTH_SECRET 是 v4)· 跟后端 JWT 共用
      AUTH_SECRET: ${SECRET_KEY:-fallback-dev-only}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - midas-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── X 营销每日推文截图 worker(阶段4a · PR-4 · 照搬 vibe-worker 范式)─────────────
  # 主 worker enqueue 到 xshot 队列 → 本服务(Playwright)截 crypto-preview 主图卡 →
  # 写 PNG 到共享卷 x_shots → 结果经 Celery link 回主 worker 更新 image_path。
  # ★ 独立镜像 midas-xshot(手工 build · 不进 compose build)· 不连 DB(只截图,不落库)。
  # ★★ 部署前必须先在 VPS 手动 build:docker build -t midas-xshot:0.1.0 deploy/xshot/
  #     (否则 compose up 找不到镜像 → 回滚,踩 vibe S1a 坑)。
  x-shooter:
    image: midas-xshot:0.1.1          # ★ 独立镜像(非 compose build)· VPS 手工 build · 0.1.1 修缺 playwright
    container_name: midas-xshot
    restart: unless-stopped
    # ★ 1.5g 硬限(阶段1 验证的资源隔离 · 不挤 clickhouse/worker)
    mem_limit: 1.5g
    # ★ python3 -m celery(非裸 celery):用 Dockerfile build-check 验过的同一 python3 跑 worker,
    #   保证跑 worker 的 python = 装了 playwright 的 python(去掉裸 `celery` 走哪个 python 的歧义)。
    command:
      - python3
      - -m
      - celery
      - -A
      - xshot_celery_app
      - worker
      - -Q
      - xshot
      - --concurrency=1            # ★ 串行(一次一个浏览器 · 1.5g 内不堆)
      - -n
      - xshot@%h
      - --loglevel=info
    env_file:
      - path: ../.env
        required: true
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      XSHOT_BASE_URL: ${PUBLIC_WEB_URL:-https://midastrade.asia}  # 截公开 crypto-preview
      XSHOT_DIR: /shots
      PYTHONUNBUFFERED: "1"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - midas-net
    volumes:
      # ★ 相对路径以 compose 所在 docker/ 为基:../ = 仓库根 · celery app + 截图脚本运行时挂载
      - ../deploy/xshot/xshot_celery_app.py:/work/xshot_celery_app.py:ro
      - ../deploy/xshot/capture.py:/work/capture.py:ro
      - x_shots:/shots                  # ★ 写截图 PNG(主 worker 读删)

networks:
  midas-net:
    name: midas-net
    driver: bridge

volumes:
  postgres_data:
    name: midas-postgres-data
  clickhouse_data:
    name: midas-clickhouse-data
  redis_data:
    name: midas-redis-data
  backtest_runs:
    name: midas-backtest-runs
  # ★ X 营销每日推文截图共享卷(x-shooter 写 / 主 worker 24h 清理删 / api FileResponse 读)
  x_shots:
    name: midas-x-shots
